services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: flowpay
      POSTGRES_USER: flowpay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a local-only value before starting PostgreSQL}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - flowpay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowpay -d flowpay"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flowpay-postgres-data:
